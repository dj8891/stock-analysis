name: Deploy Spring Boot App

on:
  push:
    branches:
      - [main]
  pull_request:
    branches:
      - [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: "23"
          distribution: "temurin"

      - name: Build the Project
        run: mvn clean install

      - name: Deploy the App
        run: sudo cp target/stock_analysis-0.0.1-SNAPSHOT.jar /path/to/deployment/location && sudo systemctl restart stock_analysis.service
