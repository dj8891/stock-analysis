name: Deploy Spring Boot Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 600
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: "23"
          distribution: "temurin"

      - name: Check Java Version
        run: java -version

      - name: Check Maven Version
        run: mvn -v

      - name: Build the Project
        run: mvn clean install

      - name: Deploy the App
        run: sudo java -jar target/stock_analysis-0.0.1-SNAPSHOT.jar