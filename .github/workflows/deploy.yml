name: Deploy Spring Boot App

on:
  push:
    branches:
      - [main]
  pull_request:
    branches:
      - [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: "23"
          distribution: "temurin"

      - name: Build and Deploy
        run: sudo mvn clean install

      - name: Complete
        run: sudo java -jar stock_analysis-0.0.1-SNAPSHOT.jar &
